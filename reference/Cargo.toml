[workspace]
resolver = "2"
members = ["crates/sharenet-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
ed25519-dalek = { version = "2", features = ["zeroize"] }
sha2 = "0.10"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
