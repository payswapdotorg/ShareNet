      Network.framework adapter layer (guarded #if
      canImport(Network)) — never compiled or executed without
      macOS/iOS
    operator_step: swift test on macOS 13+ / Xcode 15+ compiles and
      exercises the Network adapter layer (the logic core already
      runs on Linux)
  - id: R9-002-platform
    what: the iOS Packet Tunnel evaluation criteria are delivered
      (docs/architecture/wave20-platform-items.md); the platform leg
      needs macOS + Xcode + Apple's networkextension entitlement
      (manual approval)
    operator_step: apply the entitlement, then evaluate the
      Contract/ seam + the R10-002 bridge class against the criteria
  - id: R10-002-device
    what: the Android JNI bridge is implemented and host-verified
      (real gateway stack + symbol surface); the physical-device run
      needs the Android NDK + a phone
    operator_step: the cargo-ndk runbook in transport/android/vpn/
      README.md §The JNI bridge
  - id: R10-003-wall-clock
    what: the endurance laws are proven on the accelerated profile;
      the literal 24-hour wall-clock profile is the operator command
    operator_step: sharenet_endurance run --sessions 1440
      --spacing-ms 60000 --uplink <real-upstream>
  - id: R2-002-device
    what: the Wi-Fi Aware adapter (R2-002, post-closure insert
      2026-09-16) is implemented and host-verified end-to-end through
      FakeAwareApi (89/89 tests, L009 seams clean, real-SDK AAR
      builds); the physical NAN radio leg needs aware-capable
      hardware
    operator_step: on an Android device with Wi-Fi Aware support,
      build the app embedding ShareNetAwareService and exercise
      discovery -> datapath -> frame exchange against a peer device
      (the facade seam is AndroidAwareApi.kt; runbook pattern mirrors
      transport/android/vpn/README.md §The JNI bridge)
verification_rule: no completion claim without production caller + required verification level + fresh pushed-head audit
