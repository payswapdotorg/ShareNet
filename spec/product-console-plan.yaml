execution_rules:
  max_direct_workers: 3
  wave_rule: every listed predecessor must complete in an earlier wave; never rely on same-wave ordering
  worker_fill_rule: do not fill a worker slot artificially; dependency independence takes priority
  integration_rule: Tech Lead integrates each completed item before it becomes a predecessor for a later wave
waves:
  - {id: P1, parallel: [C1-001, C2-001, C2-005]}
  - {id: P2, parallel: [C1-002, C2-002, C2-003]}
  - {id: P3, parallel: [C1-003, C1-004, C2-006]}
  - {id: P4, parallel: [C2-004, C3-001, C3-002]}
  - {id: P5, parallel: [C2-007, C2-009, C1-005]}
  - {id: P6, parallel: [C2-008, C1-006, C3-003]}
  - {id: P7, parallel: [C2-010, C3-004]}
  - {id: P8, parallel: [C3-005]}
  - {id: P9, parallel: [C3-006]}
non_goals:
  - change frozen protocol wire semantics
  - move ADCOS authority into the console or developer API
  - make console the node runtime
  - promise offline mesh participation through a browser alone
  - require cloud availability for local ShareNet operation
  - expose private node keys to host apps
  - let host applications import reference/ protocol internals
