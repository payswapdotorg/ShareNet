version: 2
program: ShareNet Productization
status: FROZEN_POST_CLOSURE_IMPLEMENTATION_PLAN
purpose: >
  Turn the executed ShareNet protocol/runtime into a discoverable product and
  an embeddable connectivity capability for third-party applications, without
  reopening the frozen R0-R10 protocol architecture.
source_of_truth:
  architecture: spec/architecture.md
  locks: spec/architecture-lock.md
  registry: spec/protocol-registry.yaml
  frozen_execution: spec/work-items.yaml
  execution_evidence: docs/tech-lead/EXECUTION-STATE.md
  platform_adapters: spec/platform-adapters.yaml
  developer_integration: spec/developer-integration.yaml
  plan: spec/product-console-plan.yaml
  handoff: docs/tech-lead/SHARENET-CONSOLE-IMPLEMENTATION-HANDOFF.md
design_reference:
  ui_inspiration:
    site: https://sharenet-conformance.vercel.app
    repository: https://github.com/pectoraux/ShareNet
  carry_forward_patterns:
    - persistent high-signal navigation
    - calm status/health summaries
    - network path visualization
    - expandable evidence/details
    - adapter boundary between UI and protocol
    - public SDK boundary for embedded apps
  correction:
    - never carry forward mock protocol data into production
    - never carry forward stub production factories
    - never let host apps import protocol internals
product_principles:
  - Users discover outcomes, not R1-R10 identifiers.
  - Every major runtime capability has a human workflow.
  - Console is a presentation/control surface, not protocol authority.
  - Host applications can embed ShareNet participation through SDKs without installing a separate ShareNet app.
  - Hosted Developer API is control-plane orchestration, not the ShareNet data plane.
  - Platform adapters truthfully expose only capabilities they can execute.
  - Web is primarily a control/presentation adapter; native adapters are required for true offline/no-Internet device participation.
  - ADCOS remains authoritative for ConnectivityContract.
  - Local/offline ShareNet operation must survive cloud/control-plane outages.
navigation:
  consumer_primary: [overview, connect, network, transfers, contribution, activity, diagnostics]
  consumer_secondary: [devices, connectivity, settings]
  developer_workspace: [apps, integrations, users, devices, sessions, webhooks, evidence, usage]
  persistent_status: [internet, active_route, active_gateway, circuit, recovery, peers, queued_transfers, civic_points]
architecture:
  layers:
    consumer_console: console/
    developer_portal: console/ or developer-console/
    console_api: console-api/
    developer_api: developer-api/
    host_sdk: sdk/
    node_agent: node-agent/
    platform_adapters: transport/ + platform-specific adapter packages
    protocol: reference/
  runtime_path:
    - Host App
    - ShareNet Embedded SDK
    - Platform Adapter
    - Node Agent / Runtime
    - ShareNet Protocol
    - ADCOS through ConnectivityPort when external connectivity is needed
  web_rule: >
    Browser/PWA can display cached UI while offline and can talk to a locally
    reachable ShareNet runtime, but it cannot by itself provide raw radio/TUN,
    system-wide traffic capture, or reliable background relay.
  adcos_rule: >
    Developer API, console and node-agent must never become a second
    ConnectivityContract authority.
  security_rule: >
    No UI-generated protocol IDs, client-controlled security facts, raw private
    node seeds, provider credentials, or unrestricted gateway sockets in host apps.
journeys:
  consumer:
    - J1 first-run-no-internet
    - J2 share-my-internet
    - J3 connection-degrades-and-recovers
    - J4 send-content-without-live-internet
    - J5 earn-and-use-civic-points
    - J6 understand-the-network
    - J7 platform-readiness
    - J8 offline-control-plane-loss
  developer:
    - DEV-001 developer-integrates-sdk
    - DEV-002 user-enables-sharenet-inside-host-app
    - DEV-003 host-app-gets-connectivity
    - DEV-004 host-app-works-without-live-internet
    - DEV-005 user-contributes-from-host-app
    - DEV-006 recovery-inside-host-app
    - DEV-007 developer-observes-user-sessions
    - DEV-008 revoke-participation
    - DEV-009 web-offline-limit
    - DEV-010 server-backend-participation
user_facing_integration_components:
  - ShareNetConnectControl
  - ShareNetParticipationConsent
  - ShareNetConnectionStatus
  - ShareNetNetworkPath
  - ShareNetTransferStatus
  - ShareNetContributionSummary
  - ShareNetRecoveryBanner
  - ShareNetEvidencePanel
  - ShareNetCapabilityPicker
