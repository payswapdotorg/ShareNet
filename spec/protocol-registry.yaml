version: 1
status: NORMATIVE-SCHEMA-SKELETON

rules:
  - every_normative_wire_object_must_be_registered
  - state_machine_objects_are_registered_when_cross-process_or_durable
  - internal_runtime_objects_do_not_get_vectors_automatically
  - typescript_and_python_must_match_when_cross-language_vectors_are_defined

objects:
  - name: NodeIdentity
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: public_key (32-byte bstr), 3: created_at_unix (uint), 4: display_name (optional text, <=64 bytes)}
    id_derivation: node_id = SHA-256(canonical_cbor({1: scheme_version, 2: public_key})); caller-selected IDs forbidden
    conformance_vectors: reference/crates/sharenet-protocol/tests/vectors/identity_vectors.json
    status_note: implemented in Wave 1 (R1-001); schema recorded at Tech Lead integration from the verified implementation; cross-language vectors consumed by R1-003 in Wave 2
  - name: CapabilityStatement
    class: wire
    maturity: planned
    status_note: scheduled for R1-004 (Wave 2); schema direction — canonical CBOR map {1: scheme_version (=1, uint), 2: node_id (32-byte bstr, MUST match the Ed25519 signing key per the R1-001 derivation), 3: capabilities (array of text; initial set: gateway, relay, dtn_custodian, infrastructure), 4: issued_at_unix (uint), 5: expires_at_unix (uint, > issued_at), 6: limits (optional map of text -> int)}; Ed25519 detached signature by the node key over the canonical encoding; admission = signature + node_id binding + expiry window + capability lookup; no caller-controlled trust booleans
  - name: Advertisement
    class: wire
    maturity: foundation
  - name: LinkAuthentication
    class: wire
    maturity: foundation
  - name: RouteProposal
    class: wire
    maturity: foundation
  - name: RouteAcceptance
    class: wire
    maturity: foundation
  - name: RouteCommitment
    class: wire
    maturity: foundation
  - name: ConnectivityIntentRef
    class: integration
    maturity: planned
  - name: ConnectivityContractRef
    class: integration
    maturity: planned
  - name: ConnectivityObservation
    class: integration
    maturity: planned
  - name: CircuitSetup
    class: wire
    maturity: planned
  - name: CircuitSetupAck
    class: wire
    maturity: planned
  - name: CircuitFrame
    class: wire
    maturity: planned
  - name: CircuitDestroy
    class: wire
    maturity: planned
  - name: ContributionReceipt
    class: wire
    maturity: planned
  - name: CivicPointLedgerEntry
    class: durable-state
    maturity: planned
