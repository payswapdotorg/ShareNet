version: 1
status: NORMATIVE-SCHEMA-SKELETON

rules:
  - every_normative_wire_object_must_be_registered
  - state_machine_objects_are_registered_when_cross-process_or_durable
  - internal_runtime_objects_do_not_get_vectors_automatically
  - typescript_and_python_must_match_when_cross-language_vectors_are_defined

objects:
  - name: NodeIdentity
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: public_key (32-byte bstr), 3: created_at_unix (uint), 4: display_name (optional text, <=64 bytes)}
    id_derivation: node_id = SHA-256(canonical_cbor({1: scheme_version, 2: public_key})); caller-selected IDs forbidden
    conformance_vectors: reference/crates/sharenet-protocol/tests/vectors/identity_vectors.json
    status_note: implemented in Wave 1 (R1-001); schema recorded at Tech Lead integration from the verified implementation; cross-language vectors consumed by R1-003 in Wave 2
  - name: CapabilityStatement
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (capability.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: node_id (32-byte bstr, MUST match the Ed25519 signing key per the R1-001 derivation), 3: capabilities (array of text; strictly ascending bytewise order of the frozen initial set: dtn_custodian, gateway, infrastructure, relay; non-empty, no duplicates), 4: issued_at_unix (uint), 5: expires_at_unix (uint, > issued_at), 6: limits (optional map of text -> int; at most 32 entries, keys 1..=64 bytes)}
    signature_rule: Ed25519 detached signature by the node key over the exact canonical statement bytes; carrying envelope = canonical CBOR map {1: statement (bstr), 2: signature (64-byte bstr)}
    admission_rule: admission = strict parse + node_id binding + strict signature verification + (issued_at <= now < expires_at) + capability lookup; no caller-controlled trust booleans
    conformance_vectors: reference/crates/sharenet-protocol/tests/vectors/capability_vectors.json
    status_note: implemented in Wave 2 (R1-004); cross-language conformance (Rust + TypeScript + Python byte-exact over the vectors) held by reference/conformance (R1-003)
  - name: Advertisement
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (advertisement.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: node_identity (NodeIdentity map of the announcer), 3: capabilities (optional bstr: SignedCapabilityStatement carrying-envelope bytes), 4: transports (array of transport descriptors, each a map {1: kind (text; frozen initial set: udp, nearby, wifi_aware, quic), 2: endpoint (text, kind-specific, e.g. "host:port" for udp)}; non-empty, strictly ascending bytewise by (kind, endpoint) so exactly one byte image exists per logical advertisement), 5: issued_at_unix (uint), 6: expires_at_unix (uint, > issued_at; window bounded by AD_MAX_WINDOW = 600s)}
    signature_rule: detached Ed25519 signature by the announcer's key over the exact canonical advertisement bytes; carrying envelope = canonical CBOR {1: advertisement (bstr), 2: signature (64-byte bstr)}; advertisement_id = SHA-256(canonical advertisement bytes) — content-derived, caller-selected IDs forbidden
    verification_rule: receivers verify (in order) strict parse, signature against the embedded node_identity's key, freshness (issued_at <= now < expires_at), window bound (expires_at - issued_at <= 600), and optional capability envelope admission (binding + signature under the same identity); replayed identical advertisements are idempotent (dedup by advertisement_id) — retransmission is expected on broadcast transports; a CHANGED advertisement from the same node_id supersedes the cached one only if strictly fresher (issued_at greater)
    status_note: implemented in Wave 4 (R3-002); discovery is control-plane state built on authenticated identity (R1-001), capability admission (R1-004) and authenticated links (R3-001) — the advertisement itself is the announcement that makes a node discoverable at transport endpoints
  - name: LinkAuthentication
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (link.rs)
    wire_schema: three-message authenticated key exchange between initiator (i) and responder (r), all maps in canonical CBOR — msg1 (initiate) {1: scheme_version (=1), 2: e_i (32-byte bstr, X25519 ephemeral public key)}; msg2 (respond) {1: scheme_version (=1), 2: e_r (32-byte bstr, X25519 ephemeral public), 3: responder NodeIdentity map, 4: responder_signature (64-byte bstr), 5: capabilities (optional bstr: SignedCapabilityStatement carrying envelope bytes)}; msg3 (confirm) {1: scheme_version (=1), 2: initiator NodeIdentity map, 3: initiator_signature (64-byte bstr), 4: capabilities (optional bstr)}
    signature_rule: responder_signature = responder Ed25519 key over SHA-256("sharenet-link-auth-v1/responder" || cbor(msg1) || cbor(msg2 without field 4)); initiator_signature = initiator key over SHA-256("sharenet-link-auth-v1/initiator" || cbor(msg1) || cbor(msg2) || cbor(msg3 without field 3)); signatures are strict (malleable forms rejected)
    derivation_rule: shared_secret = X25519(e_i, e_r); salt = SHA-256(cbor(msg1) || cbor(msg2) || cbor(msg3)); okm = HKDF-SHA256(ikm = shared_secret, salt = salt, info = "sharenet-link-session-v1", L = 64); key_initiator_to_responder = okm[0..32], key_responder_to_initiator = okm[32..64]; link_id = SHA-256("sharenet-link-id-v1" || cbor(msg1) || cbor(msg2) || cbor(msg3)) — commitment-derived, caller-selected link IDs forbidden
    frame_rule: link frames are ChaCha20-Poly1305 (RFC 8439) AEAD: nonce = 4 zero bytes || seq (u64 big-endian, per direction starting at 0, strictly monotonic), AAD = "sharenet-link-frame-v1" || link_id (32 bytes) || direction byte (1 = initiator->responder, 2 = responder->initiator) || seq (u64 big-endian); receivers enforce a replay window and reject sequence reuse, non-strict ordering within the window, and any tag failure; session keys and ephemeral secrets are zeroized on drop
    status_note: implemented in Wave 3 (R3-001); design rationale — composed from standard primitives (X25519 RFC 7748, Ed25519 RFC 8032, HKDF RFC 5869, ChaCha20-Poly1305 RFC 8439) in a TLS-1.3-shaped sign-the-transcript exchange (per ADR-002 standards-first; no bespoke ciphers, no new cryptographic primitives); the exchange authenticates both endpoints against their R1-001 node identities, binds the session to the exact handshake bytes, and derives the link_id by commitment
  - name: TopologyEvidence
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (topology.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: observer_node_identity (NodeIdentity map of the ATTESTING node), 3: subject_node_id (32-byte bstr, the node being observed; MUST differ from the observer's derived node_id), 4: observation_kind (text; frozen v1 set: link, advertisement), 5: observed_at_unix (uint), 6: expires_at_unix (uint, > observed_at; window bounded by EVIDENCE_MAX_WINDOW = 3600s), 7: link_observation (optional map, present iff kind=link: {1: link_id (32-byte bstr), 2: established_at_unix (uint, <= observed_at), 3: delivered (uint), 4: lost (uint), 5: ewma_rtt_micros (uint), 6: p50_rtt_micros (uint), 7: p95_rtt_micros (uint, >= p50), 8: jitter_mad_micros (uint), 9: loss_ratio_ppm (uint, <= 1000000; the R2-004 loss ratio as integer parts-per-million because the canonical CBOR profile forbids floats)}), 8: advertisement_observation (optional map, present iff kind=advertisement: {1: advertisement_id (32-byte bstr), 2: capabilities (array of text, strictly ascending wire texts, may be empty when the advertisement carried no envelope)})}
    signature_rule: detached Ed25519 signature by the observer's key over the exact canonical evidence bytes; carrying envelope = canonical CBOR {1: evidence (bstr), 2: signature (64-byte bstr)}; evidence_id = SHA-256(canonical evidence bytes) — content-derived, caller-selected IDs forbidden
    verification_rule: receivers verify strict parse → observer signature against the embedded identity → subject != observer → freshness (observed_at <= now < expires_at, window <= 3600s) → kind-specific field consistency (link observations carry field 7 and not 8; advertisement observations carry field 8 and not 7); a link is BILATERAL only when fresh evidence from both endpoints exists (the collector's rule, per the bilateral-acknowledgement anti-gaming requirement) — a single-sided record attests one direction only
    status_note: implemented in Wave 5 (R3-003); quality fields are caller-mapped from the R2-04 LinkQualitySummary (the protocol core takes plain integers; the telemetry crate stays a transport-side dependency); durable replay-safe evidence receipts are R8-001 scope (this object is in-memory runtime evidence)
  - name: RouteProposal
    class: wire
    maturity: in-implementation
    implementation: reference/crates/sharenet-protocol (route.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: proposer NodeIdentity map, 3: path (array of 32-byte bstr node_ids, non-empty, strictly ascending bytewise so exactly one byte image exists per logical path; a hop may appear once), 4: service_class (text; frozen v1 set: live, opportunistic, dtn), 5: proposed_at_unix (uint), 6: expires_at_unix (uint, > proposed_at; window <= 3600s), 7: proposal_nonce (32-byte bstr, entropy supplied by the proposer — distinguishes otherwise identical proposals so every replacement route is genuinely new)}
    signature_rule: detached Ed25519 signature by the proposer's key over the canonical proposal bytes; carrying envelope {1: proposal (bstr), 2: signature (64-byte bstr)}; proposal_id = SHA-256(canonical proposal bytes)
  - name: RouteAcceptance
    class: wire
    maturity: in-implementation
    implementation: reference/crates/sharenet-protocol (route.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: proposal_id (32-byte bstr — the accepted proposal), 3: accepting NodeIdentity map (MUST be the identity whose node_id equals path[position] of the accepted proposal), 4: position (uint — the hop index being accepted), 5: accepted_at_unix (uint), 6: expires_at_unix (uint, > accepted_at; window <= 3600s)}
    signature_rule: detached Ed25519 signature by the accepting hop's key over the canonical acceptance bytes; carrying envelope {1: acceptance (bstr), 2: signature (64-byte bstr)}
  - name: RouteCommitment
    class: wire
    maturity: in-implementation
    implementation: reference/crates/sharenet-protocol (route.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: proposal_envelope (bstr: the signed RouteProposal carrying envelope), 3: acceptance_envelopes (array of bstr, one per path position, ordered by position), 4: commitment_root (32-byte bstr), 5: route_id (32-byte bstr)}
    derivation_rule: commitment_root = Merkle root (SHA-256, duplicate-the-last-leaf for odd counts, single leaf hashed as its own pair with itself) over the canonical acceptance bytes ordered by position; route_id = SHA-256("sharenet-route-id-v1" || commitment_root) — commitment-derived, caller-selected route IDs are FORBIDDEN (L013); the proposal is bound through proposal_id inside every acceptance
    verification_rule: receivers verify the proposal (signature, invariants), then every acceptance (signature, position < path length, accepting identity node_id == path[position], proposal_id match, freshness), that positions 0..len-1 are covered exactly once, re-derive the Merkle root and route_id, and reject any mismatch (fail-closed)
    status_note: implementation scheduled as R3-004 (Wave 6); replacement routes get fresh nonces -> fresh proposals -> fresh acceptance sets -> fresh roots -> fresh route ids (L014 replay-namespace rule); recovery/revocation of committed routes is R7 scope
  - name: RouteAcceptance
    class: wire
    maturity: foundation
  - name: RouteCommitment
    class: wire
    maturity: foundation
  - name: ConnectivityIntentRef
    class: integration
    maturity: planned
  - name: ConnectivityContractRef
    class: integration
    maturity: planned
  - name: ConnectivityObservation
    class: integration
    maturity: planned
  - name: CircuitSetup
    class: wire
    maturity: planned
  - name: CircuitSetupAck
    class: wire
    maturity: planned
  - name: CircuitFrame
    class: wire
    maturity: planned
  - name: CircuitDestroy
    class: wire
    maturity: planned
  - name: ContributionReceipt
    class: wire
    maturity: planned
  - name: CivicPointLedgerEntry
    class: durable-state
    maturity: planned
