version: 1
status: NORMATIVE-SCHEMA-SKELETON

rules:
  - every_normative_wire_object_must_be_registered
  - state_machine_objects_are_registered_when_cross-process_or_durable
  - internal_runtime_objects_do_not_get_vectors_automatically
  - typescript_and_python_must_match_when_cross-language_vectors_are_defined

objects:
  - name: NodeIdentity
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: public_key (32-byte bstr), 3: created_at_unix (uint), 4: display_name (optional text, <=64 bytes)}
    id_derivation: node_id = SHA-256(canonical_cbor({1: scheme_version, 2: public_key})); caller-selected IDs forbidden
    conformance_vectors: reference/crates/sharenet-protocol/tests/vectors/identity_vectors.json
    status_note: implemented in Wave 1 (R1-001); schema recorded at Tech Lead integration from the verified implementation; cross-language vectors consumed by R1-003 in Wave 2
  - name: CapabilityStatement
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (capability.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: node_id (32-byte bstr, MUST match the Ed25519 signing key per the R1-001 derivation), 3: capabilities (array of text; strictly ascending bytewise order of the frozen initial set: dtn_custodian, gateway, infrastructure, relay; non-empty, no duplicates), 4: issued_at_unix (uint), 5: expires_at_unix (uint, > issued_at), 6: limits (optional map of text -> int; at most 32 entries, keys 1..=64 bytes)}
    signature_rule: Ed25519 detached signature by the node key over the exact canonical statement bytes; carrying envelope = canonical CBOR map {1: statement (bstr), 2: signature (64-byte bstr)}
    admission_rule: admission = strict parse + node_id binding + strict signature verification + (issued_at <= now < expires_at) + capability lookup; no caller-controlled trust booleans
    conformance_vectors: reference/crates/sharenet-protocol/tests/vectors/capability_vectors.json
    status_note: implemented in Wave 2 (R1-004); cross-language conformance (Rust + TypeScript + Python byte-exact over the vectors) held by reference/conformance (R1-003)
  - name: Advertisement
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (advertisement.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: node_identity (NodeIdentity map of the announcer), 3: capabilities (optional bstr: SignedCapabilityStatement carrying-envelope bytes), 4: transports (array of transport descriptors, each a map {1: kind (text; frozen initial set: udp, nearby, wifi_aware, quic), 2: endpoint (text, kind-specific, e.g. "host:port" for udp)}; non-empty, strictly ascending bytewise by (kind, endpoint) so exactly one byte image exists per logical advertisement), 5: issued_at_unix (uint), 6: expires_at_unix (uint, > issued_at; window bounded by AD_MAX_WINDOW = 600s)}
    signature_rule: detached Ed25519 signature by the announcer's key over the exact canonical advertisement bytes; carrying envelope = canonical CBOR {1: advertisement (bstr), 2: signature (64-byte bstr)}; advertisement_id = SHA-256(canonical advertisement bytes) — content-derived, caller-selected IDs forbidden
    verification_rule: receivers verify (in order) strict parse, signature against the embedded node_identity's key, freshness (issued_at <= now < expires_at), window bound (expires_at - issued_at <= 600), and optional capability envelope admission (binding + signature under the same identity); replayed identical advertisements are idempotent (dedup by advertisement_id) — retransmission is expected on broadcast transports; a CHANGED advertisement from the same node_id supersedes the cached one only if strictly fresher (issued_at greater)
    status_note: implemented in Wave 4 (R3-002); discovery is control-plane state built on authenticated identity (R1-001), capability admission (R1-004) and authenticated links (R3-001) — the advertisement itself is the announcement that makes a node discoverable at transport endpoints
  - name: LinkAuthentication
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (link.rs)
    wire_schema: three-message authenticated key exchange between initiator (i) and responder (r), all maps in canonical CBOR — msg1 (initiate) {1: scheme_version (=1), 2: e_i (32-byte bstr, X25519 ephemeral public key)}; msg2 (respond) {1: scheme_version (=1), 2: e_r (32-byte bstr, X25519 ephemeral public), 3: responder NodeIdentity map, 4: responder_signature (64-byte bstr), 5: capabilities (optional bstr: SignedCapabilityStatement carrying envelope bytes)}; msg3 (confirm) {1: scheme_version (=1), 2: initiator NodeIdentity map, 3: initiator_signature (64-byte bstr), 4: capabilities (optional bstr)}
    signature_rule: responder_signature = responder Ed25519 key over SHA-256("sharenet-link-auth-v1/responder" || cbor(msg1) || cbor(msg2 without field 4)); initiator_signature = initiator key over SHA-256("sharenet-link-auth-v1/initiator" || cbor(msg1) || cbor(msg2) || cbor(msg3 without field 3)); signatures are strict (malleable forms rejected)
    derivation_rule: shared_secret = X25519(e_i, e_r); salt = SHA-256(cbor(msg1) || cbor(msg2) || cbor(msg3)); okm = HKDF-SHA256(ikm = shared_secret, salt = salt, info = "sharenet-link-session-v1", L = 64); key_initiator_to_responder = okm[0..32], key_responder_to_initiator = okm[32..64]; link_id = SHA-256("sharenet-link-id-v1" || cbor(msg1) || cbor(msg2) || cbor(msg3)) — commitment-derived, caller-selected link IDs forbidden
    frame_rule: link frames are ChaCha20-Poly1305 (RFC 8439) AEAD: nonce = 4 zero bytes || seq (u64 big-endian, per direction starting at 0, strictly monotonic), AAD = "sharenet-link-frame-v1" || link_id (32 bytes) || direction byte (1 = initiator->responder, 2 = responder->initiator) || seq (u64 big-endian); receivers enforce a replay window and reject sequence reuse, non-strict ordering within the window, and any tag failure; session keys and ephemeral secrets are zeroized on drop
    status_note: implemented in Wave 3 (R3-001); design rationale — composed from standard primitives (X25519 RFC 7748, Ed25519 RFC 8032, HKDF RFC 5869, ChaCha20-Poly1305 RFC 8439) in a TLS-1.3-shaped sign-the-transcript exchange (per ADR-002 standards-first; no bespoke ciphers, no new cryptographic primitives); the exchange authenticates both endpoints against their R1-001 node identities, binds the session to the exact handshake bytes, and derives the link_id by commitment
  - name: TopologyEvidence
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (topology.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: observer_node_identity (NodeIdentity map of the ATTESTING node), 3: subject_node_id (32-byte bstr, the node being observed; MUST differ from the observer's derived node_id), 4: observation_kind (text; frozen v1 set: link, advertisement), 5: observed_at_unix (uint), 6: expires_at_unix (uint, > observed_at; window bounded by EVIDENCE_MAX_WINDOW = 3600s), 7: link_observation (optional map, present iff kind=link: {1: link_id (32-byte bstr), 2: established_at_unix (uint, <= observed_at), 3: delivered (uint), 4: lost (uint), 5: ewma_rtt_micros (uint), 6: p50_rtt_micros (uint), 7: p95_rtt_micros (uint, >= p50), 8: jitter_mad_micros (uint), 9: loss_ratio_ppm (uint, <= 1000000; the R2-004 loss ratio as integer parts-per-million because the canonical CBOR profile forbids floats)}), 8: advertisement_observation (optional map, present iff kind=advertisement: {1: advertisement_id (32-byte bstr), 2: capabilities (array of text, strictly ascending wire texts, may be empty when the advertisement carried no envelope)})}
    signature_rule: detached Ed25519 signature by the observer's key over the exact canonical evidence bytes; carrying envelope = canonical CBOR {1: evidence (bstr), 2: signature (64-byte bstr)}; evidence_id = SHA-256(canonical evidence bytes) — content-derived, caller-selected IDs forbidden
    verification_rule: receivers verify strict parse → observer signature against the embedded identity → subject != observer → freshness (observed_at <= now < expires_at, window <= 3600s) → kind-specific field consistency (link observations carry field 7 and not 8; advertisement observations carry field 8 and not 7); a link is BILATERAL only when fresh evidence from both endpoints exists (the collector's rule, per the bilateral-acknowledgement anti-gaming requirement) — a single-sided record attests one direction only
    status_note: implemented in Wave 5 (R3-003); quality fields are caller-mapped from the R2-04 LinkQualitySummary (the protocol core takes plain integers; the telemetry crate stays a transport-side dependency); durable replay-safe evidence receipts are R8-001 scope (this object is in-memory runtime evidence)
  - name: RouteProposal
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (route.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: proposer NodeIdentity map, 3: path (array of 32-byte bstr node_ids, non-empty, strictly ascending bytewise so exactly one byte image exists per logical path; a hop may appear once), 4: service_class (text; frozen v1 set: live, opportunistic, dtn), 5: proposed_at_unix (uint), 6: expires_at_unix (uint, > proposed_at; window <= 3600s), 7: proposal_nonce (32-byte bstr, entropy supplied by the proposer — distinguishes otherwise identical proposals so every replacement route is genuinely new)}
    signature_rule: detached Ed25519 signature by the proposer's key over the canonical proposal bytes; carrying envelope {1: proposal (bstr), 2: signature (64-byte bstr)}; proposal_id = SHA-256(canonical proposal bytes)
  - name: RouteAcceptance
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (route.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: proposal_id (32-byte bstr — the accepted proposal), 3: accepting NodeIdentity map (MUST be the identity whose node_id equals path[position] of the accepted proposal), 4: position (uint — the hop index being accepted), 5: accepted_at_unix (uint), 6: expires_at_unix (uint, > accepted_at; window <= 3600s)}
    signature_rule: detached Ed25519 signature by the accepting hop's key over the canonical acceptance bytes; carrying envelope {1: acceptance (bstr), 2: signature (64-byte bstr)}
  - name: RouteCommitment
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (route.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: proposal_envelope (bstr: the signed RouteProposal carrying envelope), 3: acceptance_envelopes (array of bstr, one per path position, ordered by position), 4: commitment_root (32-byte bstr), 5: route_id (32-byte bstr)}
    derivation_rule: commitment_root = Merkle root (SHA-256, duplicate-the-last-leaf for odd counts, single leaf hashed as its own pair with itself) over the canonical acceptance bytes ordered by position; route_id = SHA-256("sharenet-route-id-v1" || commitment_root) — commitment-derived, caller-selected route IDs are FORBIDDEN (L013); the proposal is bound through proposal_id inside every acceptance
    verification_rule: receivers verify the proposal (signature, invariants), then every acceptance (signature, position < path length, accepting identity node_id == path[position], proposal_id match, freshness), that positions 0..len-1 are covered exactly once, re-derive the Merkle root and route_id, and reject any mismatch (fail-closed)
    status_note: implemented in Wave 6 (R3-004); replacement routes get fresh nonces -> fresh proposals -> fresh acceptance sets -> fresh roots -> fresh route ids (L014 replay-namespace rule); recovery/revocation of committed routes is R7 scope
  - name: QuicTunnelTransport
    class: transport
    maturity: implemented
    implementation: transport/quic (sharenet-transport-quic)
    binding_rule: the advertisement transport kind "quic" means QUIC + TLS 1.3 (quinn + rustls, ALPN "sharenet-tunnel-v1", Ed25519-only certificate signatures, TLS 1.2 refused) where each endpoint presents a SELF-SIGNED Ed25519 certificate whose private key IS the node identity key (R1-001); the pinned node identity is derived from the certificate's public key by the R1-001 rule, so TLS possession proof + pin = node authentication without a CA; clients MUST pin the server's node_id (the advertisement's announcer); servers MAY pin client node_ids (refusing unpinned clients at the handshake); an unpinned server entry is an unauthenticated transport — ShareNet-level authentication (R3-001 links, R4-002 circuits) rides INSIDE the tunnel and MUST NOT be assumed by the tunnel alone
    frame_rule: tunnel payloads are opaque length-prefixed frames (u32 big-endian, MAX_FRAME = 2 MiB, enforced on both send and receive; a receiver rejects an oversized length prefix with FrameTooLarge instead of buffering it); the frame content is not a registry object — relays forward opaque tunnel traffic (L012) and end-to-end circuit objects are R4-002 scope
    status_note: implemented in Wave 6 (R4-001); no new cryptographic primitives (ADR-002: the TLS layer supplies transport security, the identity layer supplies node authentication); the tunnel is runtime state — durable circuit state is R4-002/R7 scope; ICE/STUN/TURN traversal and relay fallback are R4-005 scope (L011)
  - name: ConnectivityIntentRef
    class: integration
    maturity: planned
  - name: ConnectivityContractRef
    class: integration
    maturity: planned
  - name: ConnectivityObservation
    class: integration
    maturity: planned
  - name: CircuitSetup
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (circuit.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: route_commitment (bstr: the RouteCommitment map bytes — fully verified at admission per R3-004), 3: setup_nonce (32-byte bstr, entropy supplied by the initiator — distinguishes otherwise identical setups so every replacement circuit is genuinely new), 4: initiator NodeIdentity map (MUST be the route proposal's proposer identity), 5: issued_at_unix (uint), 6: expires_at_unix (uint, > issued_at; window <= 3600s)}
    signature_rule: detached Ed25519 signature by the initiator's key over the exact canonical setup bytes; carrying envelope = canonical CBOR {1: setup (bstr), 2: signature (64-byte bstr)}
    derivation_rule: circuit_id = SHA-256("sharenet-circuit-id-v1" || route_id || setup_nonce) — commitment-derived through the verified route_id (L013 discipline), fresh per nonce; caller-selected circuit IDs forbidden; the (route_id, setup_nonce) pair is single-use — a replacement circuit for the same route MUST carry a fresh nonce (L014 fresh session identity and replay namespace)
    admission_rule: admission = strict parse + FULL RouteCommitment verification (R3-004: proposal, every acceptance, exact position coverage, root + route_id re-derivation) + initiator signature over the setup bytes + initiator node_id == proposal proposer node_id (circuit authority binds to route authority) + freshness (issued_at <= now < expires_at, window <= 3600s) + (route_id, nonce) never used before; no caller-controlled trust booleans
  - name: CircuitSetupAck
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (circuit.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: circuit_id (32-byte bstr — the acknowledged circuit), 3: setup_digest (32-byte bstr — SHA-256 of the canonical setup bytes, binding this ack to the exact setup), 4: accepting NodeIdentity map (MUST be the identity whose node_id equals path[position] of the verified route), 5: position (uint — the hop index being accepted), 6: accepted_at_unix (uint), 7: expires_at_unix (uint, > accepted_at; and accepted_at_unix < the setup's expires_at_unix — acks cannot outlive their setup)}
    signature_rule: detached Ed25519 signature by the accepting hop's key over the canonical ack bytes; carrying envelope {1: ack (bstr), 2: signature (64-byte bstr)}
    admission_rule: strict parse + signature + the circuit is known and pending + setup_digest match + accepting node_id == path[position] + position not yet acked (exactly-once per position; a circuit is ESTABLISHED when every position 0..len-1 is acked — mirroring the R3-004 exact-coverage rule) + freshness (accepted_at <= now < expires_at)
  - name: CircuitFrame
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (circuit.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: circuit_id (32-byte bstr), 3: direction (uint: 1 = initiator_to_exit, 2 = exit_to_initiator), 4: seq (u64 — per-direction strictly monotonic starting at 0: the circuit's replay namespace), 5: payload (bstr, 1..=2097152 bytes — opaque end-to-end bytes)}
    integrity_rule: NOT individually signed or MACed by design — hop-by-hop integrity comes from the carrying layers (R3-001 authenticated link AEAD frames / R4-001 node-pinned QUIC+TLS 1.3 tunnels), and end-to-end payload integrity is the content layer's job (R6 content addressing); architecture §9 (relay privacy) explicitly prefers standard transport security over custom per-frame cryptography — the frame itself carries only binding + ordering
    admission_rule: the circuit is ESTABLISHED (full position coverage) + not destroyed + direction in {1,2} + seq == the direction's next expected sequence (strictly monotonic from 0; replays, gaps and regressions rejected) + payload bounds (non-empty, <= 2 MiB)
  - name: CircuitDestroy
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (circuit.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: circuit_id (32-byte bstr), 3: sender NodeIdentity map (MUST be a committed path member), 4: reason (text; frozen v1 set: link_failure, policy, completed, replaced), 5: destroyed_at_unix (uint)}
    signature_rule: detached Ed25519 signature by the sender's key over the canonical destroy bytes; carrying envelope {1: destroy (bstr), 2: signature (64-byte bstr)}
    terminality_rule: a destroyed circuit is terminal forever (§11: a failed circuit is never resurrected) — frames and acks on it are rejected, the (route_id, setup_nonce) stays consumed, and a replacement circuit MUST carry a fresh nonce producing a fresh circuit_id and fresh replay namespaces (L014); duplicate destroys of the same circuit are idempotent
    status_note: implemented in Wave 7 (R4-002); the four circuit wire objects verified unit + adversarial (12 tests) + conformance (circuit_vectors.json: 3 full flows incl. fresh-nonce replacement distinctness + 7 typed rejects — all three language legs byte-identical, harness now 177 lines); the runtime CircuitRegistry is the admission pipeline (fail-closed, no caller-controlled trust booleans); durable circuit state and the live data plane (R4-003 Linux forwarding, R4-004 Android VpnService) consume these objects next
  - name: ContributionReceipt
    class: wire
    maturity: planned
  - name: CivicPointLedgerEntry
    class: durable-state
    maturity: planned
  - name: SignedConnectivityObservation
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (connectivity_evidence.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: provider (NodeIdentity map — the ADCOS provider's ShareNet-verifiable node identity), 3: contract_ref (32-byte bstr — the opaque ConnectivityContractRef), 4: kind (text; exactly one of the frozen six machine names shared with the connectivity domain: contract_activated, execution_state_changed, degraded, assurance_available, failover_replan, terminated), 5: observed_at_unix (uint), 6: sequence (uint, >= 1 — strictly increasing per (provider node_id, contract_ref): the wire-verifiable form of the per-provider monotonic sequence), 7: execution (optional map text -> int, at most 16 entries, integer counters only — no floats in the CBOR profile)}
    signature_rule: Ed25519 detached signature by the provider node key over the exact canonical observation bytes; carrying envelope = canonical CBOR map {1: observation (bstr), 2: signature (64-byte bstr)} (the CapabilityStatement envelope pattern)
    admission_rule: admission = strict parse + R1-001 node_id derivation of the provider identity + strict signature verification + (the contract_ref is known to the accepting node — never a trust grant for an unknown contract) + sequence strictly greater than the highest previously accepted observation for (provider node_id, contract_ref) + freshness window per the accepting node's policy; no caller-controlled trust booleans; UNSIGNED observations never enter durable ShareNet state — the R5-003 store's trust boundary is exactly this object's verification
    trust_boundary_note: the signature binds the provider's ShareNet identity; it does NOT attest ShareNet packet delivery and does NOT attest provider fulfillment (adcos.md: "ADCOS does not attest ShareNet packet delivery. ShareNet does not attest provider fulfillment.") — the observation is the provider's own claim about its contract lifecycle
    conformance_vectors: reference/crates/sharenet-protocol/tests/vectors/connectivity_evidence_vectors.json
    status_note: registered ahead of implementation per the registry-before-implementation rule; implemented in Wave 10 (R5-004) — unit (8) + adversarial (12) + conformance (harness now 218 byte-identical lines across Rust/TypeScript/Python); the ADCOS adapter (connectivity-client) carries it over the real developer API and feeds ONLY VERIFIED observations into the connectivity crate's port + the R5-003 durable store (the restart suite proves verified evidence survives reload and unsigned/rewritten observations NEVER enter the store); kinds mirror the adcos.md event mapping with machine names shared with the zero-dependency domain crate (no second vocabulary)
  - name: ContentManifest
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (content.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: chunk_size (uint, 1..=2097152 — the fixed chunk byte length; the LAST chunk may be shorter), 3: total_length (uint, >= 1), 4: chunk_hashes (array of 32-byte bstr, non-empty, ceil(total_length/chunk_size) entries exactly), 5: content_type (text, 1..=64 bytes, UTF-8), 6: metadata (optional map text -> bounded text/int, at most 16 entries, keys 1..=64 bytes — application metadata, NEVER interpreted by the protocol), 7: created_at_unix (uint)}
    identity_rule: content_id = SHA-256(canonical_cbor(ContentManifest)) — the manifest IS the named object (commitment-derived identity, L013 discipline: no caller-selected content ids); two byte-identical manifests are the same content by construction; chunk integrity = SHA-256 per chunk, verified against the manifest's list at reassembly time (end-to-end payload integrity is content addressing's job per the CircuitFrame integrity_rule)
    admission_rule: strict parse with total/chunk-count exactness (chunk_hashes.len() == ceil(total_length / chunk_size)), chunk_size bounds, metadata bounds, no floats; a chunk stream reassembles iff every chunk hash matches its manifest slot in order and the total byte count is exact — no partial acceptance, no caller-controlled trust booleans
    status_note: registered ahead of R6-001 implementation (Wave 11) per the registry-before-implementation rule; the chunk-transfer/resume machinery is R6-002 and DTN storage/carry is R6-003 — this object is only the addressing foundation; implementation home = reference/crates/sharenet-protocol (content.rs) with vectors + three-language conformance; BPv7 interop stays a future adapter (architecture §12: borrow DTN principles, rebuild nothing)
  - name: CircuitRevocation
    class: wire
    maturity: implemented
    implementation: reference/crates/sharenet-protocol (revocation.rs)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: circuit_id (32-byte bstr — the revoked circuit), 3: revoker (NodeIdentity map — MUST be a committed path member of the revoked circuit), 4: reason (text; frozen v1 set: link_failure, evidence_timeout, policy, operator), 5: evidence (map: failure_kind text + at most 8 integer/text evidence fields, e.g. missed_acks, stale_since_unix — bounded, honest: absence of evidence fields is legal, a revocation on policy grounds needs no telemetry), 6: revoked_at_unix (uint)}
    signature_rule: Ed25519 detached signature by the revoker's key over the exact canonical revocation bytes; carrying envelope = canonical CBOR map {1: revocation (bstr), 2: signature (64-byte bstr)} (the established envelope pattern)
    durability_rule: L015 — revocation is DURABLE and AUTHORITATIVE: once a revocation for a circuit_id is durably recorded, no recovery may resurrect that circuit (the (route_id, setup_nonce) stays consumed forever, the circuit_id stays terminal); duplicate revocations of the same circuit by the same revoker are idempotent; a second revocation by a DIFFERENT path member is recorded but never un-revokes
    admission_rule: strict parse + R1-001 node_id derivation of the revoker + strict signature verification + (the revoker's node_id MUST appear in the revoked circuit's committed path — verified against the CircuitRegistry's established record, never caller-asserted) + reason in the frozen set + revoked_at not in the future; no caller-controlled trust booleans
    conformance_vectors: reference/crates/sharenet-protocol/tests/vectors/revocation_vectors.json
    status_note: registered ahead of implementation per the registry-before-implementation rule; implemented in Wave 11 (R7-001) — unit + adversarial (21: per-field tamper, foreign key, non-path-member revoker, future timestamp, evidence violations, envelope confusion, revoked-circuit admission refusal incl. L015 enforcement with runtime-destroy-state loss) + conformance (revocation_vectors.json: 4 cases rebuilding the full R3-004 route chain + circuit setup, 9 receive-ledger outcomes incl. revoker_not_on_path/revoked_at_in_future/circuit_unknown, 13 parse + 4 envelope rejects; harness 283 byte-identical lines); relationship to CircuitDestroy: destroy is the RUNTIME teardown any path member may trigger with terminal semantics; revocation is the DURABLE record the failure detector (typed verdicts: LinkFailure/EvidenceTimeout/Policy/Operator — runtime state, not a wire object) PRODUCES and that recovery (R7-002+) MUST consult — recovery cannot resurrect a revoked circuit (§11 + L015); durability modeled via an injectable snapshot seam, full durable files are R7-002 scope
  - name: ContributionReceipt
    class: wire
    maturity: registered
    implementation: reference/crates/sharenet-protocol (contribution.rs; R8-001 scope)
    wire_schema: canonical CBOR map {1: scheme_version (=1, uint), 2: issuer (NodeIdentity map — the RECEIVING counterparty acknowledging the contribution; the bilateral-acknowledgement rule makes the recipient the signer), 3: contributor_node_id (32-byte bstr — the node whose contribution is acknowledged; MUST differ from the issuer's derived node_id, the self-receipt exclusion), 4: content_id (32-byte bstr — the R6-001 commitment-derived content id of the object the contribution moved; content/packet identity), 5: contribution_kind (text; frozen v1 set: carried, delivered — carried = the issuer took custody from the contributor (DTN handover, R6-003), delivered = the issuer is the terminal destination consuming the content), 6: delivered_bytes (uint, >= 1, <= 2^40 — the acknowledged quantity base; the issuer counts what it actually received, verified against the content_id's manifest total when the manifest is in hand), 7: receipt_seq (uint, >= 1 — the issuer's strictly-increasing sequence number PER (issuer, contributor) pair; the monotonic-receipt-sequence rule), 8: issued_at_unix (uint, <= the verifying clock — a future-dated receipt is refused typed)}
    signature_rule: Ed25519 detached signature by the ISSUER's key (the recipient — bilateral acknowledgement) over the exact canonical receipt bytes; carrying envelope = canonical CBOR map {1: receipt (bstr), 2: signature (64-byte bstr)} (the established envelope pattern); receipt_id = SHA-256(canonical receipt bytes) — content-derived, caller-selected IDs forbidden (L013)
    admission_rule: strict parse + R1-001 node_id derivation of the issuer + strict signature verification + contributor != issuer (the self-receipt exclusion at the schema level; Sybil weighting is R8-002/R8-005's valuation, not the receipt's) + contribution_kind in the frozen set + issued_at not in the future + receipt_seq strictly greater than the last ACCEPTED receipt from the same (issuer, contributor) pair (durable idempotency + duplicate/replay refusal — identical receipt_ids are idempotent, a regressed or repeated sequence number is refused typed); no caller-controlled trust booleans
    trust_boundary_note: a receipt is the issuer's AUTHENTICATED claim that the contributor's contribution reached it — it is NOT proof of useful work (valuation is R8-002), NOT protection against Sybil multiplication or circular traffic (the anti-gaming analysis is R8-005), and a receipt issued by a key the contributor itself controls (the Sybil degenerate) is only detectable at the valuation/analysis layers; the object carries exactly the bilateral fact (§14's "bilateral/recipient acknowledgement" + "content/packet identity" + "monotonic receipt sequence")
    conformance_vectors: reference/crates/sharenet-protocol/tests/vectors/contribution_vectors.json (to be generated by the Rust core per the majority precedent; three-language byte-identical legs)
    status_note: registered ahead of implementation per the registry-before-implementation rule (Wave 17, R8-001); deps R6-003 (the custody events the receipts acknowledge) + R7-004 (the replacement circuits that keep gateways contributing) — the R6-003 custody log (unsigned local facts) is the INPUT the R8-002+ ledger verifies; this object is its signed, cross-node form
