  - id: R6
    name: dtn-and-content
    objective: opportunistic and store-carry-forward Internet/content delivery

  - id: R7
    name: automatic-recovery
    objective: durable failure detection, replanning and replacement circuits

  - id: R8
    name: contribution-and-civic-points
