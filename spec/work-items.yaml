version: 1
program: ShareNet
status: FROZEN_EXECUTION_PLAN
worker_limit: 3

rules:
  - Every item has exactly one primary owner.
  - Workers may run concurrently only when predecessors are COMPLETE and the item has no conflicting file/architecture authority.
  - An item is not complete because code exists or tests pass; production callers and the required verification level are mandatory.
  - Protocol-core and runtime/platform work may proceed in parallel only across explicit interface contracts frozen in spec/adrs/.
  - Any normative wire/state-machine change requires an ADR/spec update before implementation.
  - No worker may silently expand an item into a downstream item.

