[package]
name = "sharenet-transport-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "ShareNet Linux transport foundation: TUN abstraction, capability probe, and raw local UDP transport (platform adapter layer, no protocol semantics)."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "sharenet_transport_linux"
path = "src/lib.rs"

[[bin]]
name = "sharenet_transport_linux"
path = "src/bin/sharenet_transport_linux.rs"

# R10-001: the two-process Linux loopback bridge — the participant role
# composes the LIVE gateway session (R4-003 data plane) with the
# durable recovery pipeline (R7-003 selection + R7-004 replacement
# circuit) over the REAL wire evidence, so the recovery record
# describes the circuit that actually carries the bytes.
[[bin]]
name = "sharenet_loopback"
path = "src/bin/sharenet_loopback.rs"

# R10-003: the endurance/restart harness — the R10-001 bridge cycled
# over the R9-003 appliances with induced deaths, restarts (durable
# identity + journal continuity), accumulating recovery state and
# RSS envelope laws. The 24h operator profile is --sessions 1440
# --spacing-ms 60000; the sandbox runs the accelerated profile.
[[bin]]
name = "sharenet_endurance"
path = "src/bin/sharenet_endurance.rs"

[dependencies]
libc = "0.2"
sharenet-protocol = { path = "../../reference/crates/sharenet-protocol" }
sharenet-transport-quic = { path = "../quic" }
sharenet-transport-telemetry = { path = "../telemetry" }
sharenet-recovery = { path = "../../recovery" }
sharenet-admission = { path = "../../admission" }
sharenet-connectivity = { path = "../../connectivity" }

[dev-dependencies]
# None needed: adversarial and multiprocess tests use std only.

[profile.release]
debug = true
